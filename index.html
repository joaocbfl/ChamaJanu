<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Chamada Escolar</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f8f9fa;
  color: #202124;
}


/* =========================================================
   APLICAÇÃO
========================================================= */

.app {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {
  margin-bottom: 20px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -.3px;
}

.header p {
  margin: 6px 0 0;
  color: #5f6368;
  font-size: 14px;
}


/* =========================================================
   PAINEL DE CONTROLES
========================================================= */

.controles {
  background: #fff;

  border: 1px solid #dadce0;
  border-radius: 14px;

  padding: 18px;

  display: grid;

  grid-template-columns:
    170px
    minmax(180px, 1fr)
    auto;

  gap: 14px;

  align-items: end;

  margin-bottom: 18px;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 7px;

  min-width: 0;
}

.campo label {
  font-size: 12px;
  font-weight: 600;
  color: #5f6368;
}

input,
select {
  width: 100%;
  height: 44px;

  border: 1px solid #dadce0;
  border-radius: 9px;

  padding: 0 12px;

  background: #fff;

  color: #202124;

  font-size: 14px;

  outline: none;
}

input:focus,
select:focus {
  border-color: #1a73e8;

  box-shadow:
    0 0 0 3px
    rgba(26,115,232,.10);
}


/* =========================================================
   BOTÕES
========================================================= */

button {
  border: 0;

  border-radius: 9px;

  height: 44px;

  padding: 0 18px;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  transition:
    background .15s,
    transform .08s,
    opacity .15s;

  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.btn-principal {
  background: #1a73e8;
  color: #fff;
}

.btn-principal:hover {
  background: #1769d1;
}

.btn-secundario {
  background: #f1f3f4;
  color: #202124;
}

.btn-secundario:hover {
  background: #e8eaed;
}

.btn-perigo {
  background: #d93025;
  color: #fff;
}


/* =========================================================
   STATUS
========================================================= */

.status {
  display: none;

  width: 100%;

  padding: 12px 15px;

  margin-bottom: 18px;

  border-radius: 10px;

  font-size: 14px;
}

.status.sucesso {
  display: block;

  background: #e6f4ea;

  color: #137333;

  border: 1px solid #b7dfb9;
}

.status.erro {
  display: block;

  background: #fce8e6;

  color: #c5221f;

  border: 1px solid #f5aaa5;
}


/* =========================================================
   ÁREA DA TURMA
========================================================= */

.turma-area {
  width: 100%;
}

.turma-cabecalho {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 12px;
}

.turma-nome {
  font-size: 21px;
  font-weight: 600;
}

.turma-info {
  color: #5f6368;
  font-size: 13px;
}


/* =========================================================
   BARRA DE RESUMO
========================================================= */

.resumo-topo {

  background: #fff;

  border: 1px solid #dadce0;

  border-radius: 12px;

  padding: 13px 16px;

  margin-bottom: 12px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;
}

.resumo-esquerda {
  color: #5f6368;
  font-size: 13px;
}

.resumo-esquerda strong {
  color: #202124;
}

.resumo-faltas {
  display: flex;

  align-items: center;

  gap: 7px;

  font-size: 14px;

  font-weight: 600;
}

.falta-numero {
  display: inline-flex;

  align-items: center;

  justify-content: center;

  min-width: 30px;
  height: 30px;

  padding: 0 8px;

  border-radius: 15px;

  background: #fce8e6;

  color: #c5221f;
}


/* =========================================================
   LISTA DE ESTUDANTES
========================================================= */

/*
   DUAS COLUNAS REAIS.
   Não depende de largura mínima dos cartões.
*/

.estudantes {

  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 8px;

  width: 100%;
}


/* =========================================================
   ITEM DO ESTUDANTE
========================================================= */

.estudante {

  position: relative;

  width: 100%;
  min-width: 0;

  min-height: 52px;

  background: #fff;

  border: 1px solid #dadce0;

  border-radius: 9px;

  padding: 9px 12px;

  display: flex;

  align-items: center;

  cursor: pointer;

  user-select: none;

  transition:
    background .12s,
    border-color .12s,
    transform .08s;

  -webkit-tap-highlight-color: transparent;
}

.estudante:hover:not(.bloqueado) {
  border-color: #1a73e8;
  background: #f8fbff;
}

.estudante:active:not(.bloqueado) {
  transform: scale(.99);
}


/* =========================================================
   INDICADOR
========================================================= */

.indicador {

  width: 22px;
  height: 22px;

  min-width: 22px;

  border-radius: 50%;

  border: 2px solid #bdc1c6;

  margin-right: 9px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 12px;

  font-weight: bold;

  color: transparent;

  transition: .12s;
}


/* =========================================================
   NOME
========================================================= */

.nome {

  width: 100%;
  min-width: 0;

  font-size: 13px;

  line-height: 1.25;

  font-weight: 600;

  color: #202124;

  overflow-wrap: anywhere;
}


/* =========================================================
   FALTA
========================================================= */

.estudante.ausente {

  background: #fce8e6;

  border-color: #f5aaa5;
}

.estudante.ausente .indicador {

  background: #d93025;

  border-color: #d93025;

  color: #fff;
}

.estudante.ausente .nome {
  color: #c5221f;
}


/* =========================================================
   REGISTRO JÁ EXISTENTE
========================================================= */

.estudante.bloqueado {

  background: #f8f9fa;

  cursor: default;

  border-color: #e0e0e0;
}

.estudante.bloqueado .indicador {

  border-color: #dadce0;

  background: #f1f3f4;
}

.estudante.bloqueado .nome {

  color: #80868b;
}


/* =========================================================
   CARREGANDO / VAZIO
========================================================= */

.carregando,
.vazio {

  background: #fff;

  border: 1px solid #dadce0;

  border-radius: 12px;

  padding: 35px 20px;

  text-align: center;

  color: #5f6368;

  font-size: 14px;
}


/* =========================================================
   ÁREA DE SALVAMENTO
========================================================= */

.salvar-area {

  position: sticky;

  bottom: 0;

  z-index: 10;

  margin-top: 18px;

  padding-top: 10px;

  background:
    linear-gradient(
      to bottom,
      rgba(248,249,250,0),
      #f8f9fa 20%
    );
}

.salvar-box {

  background: #fff;

  border: 1px solid #dadce0;

  border-radius: 12px;

  padding: 12px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  box-shadow:
    0 2px 8px rgba(60,64,67,.10);
}

.salvar-info {

  font-size: 13px;

  color: #5f6368;
}

.salvar-info strong {

  color: #202124;

  font-size: 15px;
}

.btn-salvar {

  height: 46px;

  padding: 0 24px;

  background: #1a73e8;

  color: #fff;

  white-space: nowrap;
}

.btn-salvar:hover {
  background: #1769d1;
}


/* =========================================================
   RESPONSIVIDADE
========================================================= */

@media screen and (max-width: 750px) {

  .app {

    width: 100%;

    max-width: none;

    padding: 12px;
  }

  .header {

    margin-bottom: 15px;
  }

  .header h1 {

    font-size: 23px;
  }

  .header p {

    font-size: 13px;
  }


  /* CONTROLES */

  .controles {

    grid-template-columns: 1fr;

    gap: 10px;

    padding: 13px;

    border-radius: 12px;
  }


  /* =====================================================
     DUAS COLUNAS NO CELULAR
  ===================================================== */

  .estudantes {

    display: grid !important;

    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr) !important;

    gap: 6px !important;

    width: 100% !important;
  }


  .estudante {

    min-height: 50px;

    padding: 8px 8px;

    border-radius: 8px;
  }


  .indicador {

    width: 20px;
    height: 20px;

    min-width: 20px;

    margin-right: 7px;

    font-size: 11px;
  }


  .nome {

    font-size: 11.5px;

    line-height: 1.25;
  }


  .turma-nome {

    font-size: 18px;
  }

  .turma-info {

    font-size: 11px;
  }


  .resumo-topo {

    padding: 10px 12px;
  }


  .salvar-box {

    padding: 10px;
  }

  .btn-salvar {

    padding: 0 17px;

    font-size: 13px;
  }

}


/* =========================================================
   CELULARES PEQUENOS
========================================================= */

@media screen and (max-width: 400px) {

  .app {

    padding: 8px;
  }


  .estudantes {

    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr) !important;

    gap: 5px !important;
  }


  .estudante {

    min-height: 48px;

    padding: 7px 6px;
  }


  .indicador {

    width: 18px;
    height: 18px;

    min-width: 18px;

    margin-right: 6px;
  }


  .nome {

    font-size: 10.5px;
  }


  .salvar-info {

    font-size: 11px;
  }


  .btn-salvar {

    height: 44px;

    padding: 0 13px;

    font-size: 12px;
  }

}


/* =========================================================
   CELULARES MUITO PEQUENOS
========================================================= */

@media screen and (max-width: 330px) {

  .estudante {

    padding: 6px 5px;
  }

  .nome {

    font-size: 9.5px;
  }

  .indicador {

    width: 17px;
    height: 17px;

    min-width: 17px;

    margin-right: 5px;
  }

}


/* =========================================================
   GARANTIA DE DUAS COLUNAS
========================================================= */

.estudantes {

  grid-auto-flow: row;

  grid-auto-columns: auto;

}

</style>

</head>

<body>

<div class="app">

  <!-- =====================================================
       CABEÇALHO

<script>

/* =========================================================
   API
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzThUzCIL-flrxxXbssTVkti4zm3F7W6xZQW_J7Nw9igoflgzFQ27tjPaMtJk4Jcs9o/exec';


/* =========================================================
   VARIÁVEIS
========================================================= */

let estudantesAtuais = [];

let turmaAtual = '';

let filaChamadas = [];


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function () {

    definirDataAtual();

    carregarTurmas();

    renderizarFila();

  }
);


/* =========================================================
   DATA ATUAL
========================================================= */

function definirDataAtual() {

  const hoje =
    new Date();

  const ano =
    hoje.getFullYear();

  const mes =
    String(
      hoje.getMonth() + 1
    ).padStart(2, '0');

  const dia =
    String(
      hoje.getDate()
    ).padStart(2, '0');

  document.getElementById(
    'data'
  ).value =
    ano +
    '-' +
    mes +
    '-' +
    dia;

}


/* =========================================================
   CARREGAR TURMAS
========================================================= */

async function carregarTurmas() {

  const select =
    document.getElementById(
      'turma'
    );

  select.innerHTML =
    '<option value="">Carregando turmas...</option>';

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=turmas'
      );

    const dados =
      await resposta.json();

    select.innerHTML =
      '<option value="">Selecione a turma</option>';


    if (
      dados &&
      Array.isArray(
        dados.turmas
      )
    ) {

      dados.turmas.forEach(
        function (turma) {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            turma;

          option.textContent =
            turma;

          select.appendChild(
            option
          );

        }
      );

    }

  } catch (erro) {

    select.innerHTML =
      '<option value="">Erro ao carregar turmas</option>';

    mostrarStatus(
      'Erro ao carregar as turmas.',
      'erro'
    );

    console.error(
      erro
    );

  }

}


/* =========================================================
   EVENTO TURMA
========================================================= */

document
  .getElementById('turma')
  .addEventListener(
    'change',
    function () {

      const turma =
        this.value;

      if (!turma) {

        turmaAtual =
          '';

        estudantesAtuais =
          [];

        document.getElementById(
          'areaEstudantes'
        ).innerHTML =
          '';

        document.getElementById(
          'salvarArea'
        ).style.display =
          'none';

        return;

      }

      carregarEstudantes(
        turma
      );

    }
  );


/* =========================================================
   EVENTO DATA
========================================================= */

document
  .getElementById('data')
  .addEventListener(
    'change',
    function () {

      if (turmaAtual) {

        carregarEstudantes(
          turmaAtual
        );

      }

    }
  );


/* =========================================================
   CARREGAR ESTUDANTES
========================================================= */

async function carregarEstudantes(
  turma
) {

  const data =
    document.getElementById(
      'data'
    ).value;


  if (
    !turma ||
    !data
  ) {

    return;

  }


  turmaAtual =
    turma;


  const area =
    document.getElementById(
      'areaEstudantes'
    );


  area.innerHTML =
    '<div class="carregando">' +
    'Carregando estudantes...' +
    '</div>';


  document.getElementById(
    'salvarArea'
  ).style.display =
    'none';


  try {

    const url =
      API_URL +
      '?acao=estudantes' +
      '&turma=' +
      encodeURIComponent(
        turma
      ) +
      '&data=' +
      encodeURIComponent(
        data
      );


    const resposta =
      await fetch(
        url
      );


    const dados =
      await resposta.json();


    if (
      !dados ||
      !Array.isArray(
        dados.estudantes
      )
    ) {

      throw new Error(
        'Formato de resposta inválido.'
      );

    }


    estudantesAtuais =
      dados.estudantes.map(
        function (estudante) {

          let status =
            String(
              estudante.statusExistente ||
              ''
            )
            .trim()
            .toUpperCase();


          if (
            status !== 'A' &&
            status !== 'C' &&
            status !== 'F'
          ) {

            status =
              '';

          }


          return {

            id:
              estudante.id ||
              '',

            nome:
              estudante.nome ||
              '',

            statusExistente:
              status,

            presenca:
              status === 'F'
                ? 'F'
                : 'C'

          };

        }
      );


    renderizarEstudantes();

  } catch (erro) {

    area.innerHTML =
      '<div class="vazio">' +
      'Não foi possível carregar os estudantes.' +
      '</div>';


    mostrarStatus(
      'Erro ao carregar os estudantes.',
      'erro'
    );


    console.error(
      erro
    );

  }

}


/* =========================================================
   RENDERIZAR ESTUDANTES
========================================================= */

function renderizarEstudantes() {

  const area =
    document.getElementById(
      'areaEstudantes'
    );


  if (
    !estudantesAtuais.length
  ) {

    area.innerHTML =
      '<div class="vazio">' +
      'Nenhum estudante encontrado.' +
      '</div>';

    document.getElementById(
      'salvarArea'
    ).style.display =
      'none';

    return;

  }


  let html =
    '';


  /* CABEÇALHO DA TURMA */

  html +=
    '<div class="turma-area">';


  html +=
    '<div class="turma-cabecalho">';


  html +=
    '<div class="turma-nome">' +
    escaparHTML(
      turmaAtual
    ) +
    '</div>';


  html +=
    '<div class="turma-info">' +
    estudantesAtuais.length +
    ' estudantes' +
    '</div>';


  html +=
    '</div>';


  /* RESUMO */

  const faltas =
    contarFaltasSelecionadas();


  html +=
    '<div class="resumo-topo">';


  html +=
    '<div class="resumo-esquerda">' +
    '<strong>Frequência</strong>' +
    ' · toque nos nomes para marcar falta' +
    '</div>';


  html +=
    '<div class="resumo-faltas">' +
    'Faltas' +
    '<span class="falta-numero">' +
    faltas +
    '</span>' +
    '</div>';


  html +=
    '</div>';


  /* LISTA */

  html +=
    '<div class="estudantes">';


  estudantesAtuais.forEach(
    function (
      estudante,
      index
    ) {

      const existente =
        estudante.statusExistente;


      const falta =
        !existente &&
        estudante.presenca === 'F';


      html +=
        '<div class="estudante ' +

        (
          existente
            ? 'bloqueado '
            : ''
        ) +

        (
          falta
            ? 'ausente'
            : ''
        ) +

        '"' +


        (
          existente
            ? ''
            : ' onclick="alternarFalta(' +
              index +
              ')"'
        ) +


        '>';


      /* INDICADOR */

      html +=
        '<div class="indicador">';


      if (falta) {

        html +=
          '✓';

      }


      html +=
        '</div>';


      /* NOME */

      html +=
        '<div class="nome">' +
        escaparHTML(
          estudante.nome
        ) +
        '</div>';


      html +=
        '</div>';

    }
  );


  html +=
    '</div>';


  html +=
    '</div>';


  area.innerHTML =
    html;


  atualizarAreaSalvar();

}


/* =========================================================
   ALTERNAR FALTA
========================================================= */

function alternarFalta(index) {

  const estudante =
    estudantesAtuais[index];


  if (!estudante) {
    return;
  }


  /*
   * Não permite alterar registros
   * que já estavam gravados.
   */

  if (
    estudante.statusExistente
  ) {

    return;

  }


  if (
    estudante.presenca === 'F'
  ) {

    estudante.presenca =
      'C';

  } else {

    estudante.presenca =
      'F';

  }


  renderizarEstudantes();

}


/* =========================================================
   CONTAR FALTAS
========================================================= */

function contarFaltasSelecionadas() {

  return estudantesAtuais.filter(
    function (estudante) {

      return (
        !estudante.statusExistente &&
        estudante.presenca === 'F'
      );

    }
  ).length;

}


/* =========================================================
   ATUALIZAR ÁREA SALVAR
========================================================= */

function atualizarAreaSalvar() {

  const area =
    document.getElementById(
      'salvarArea'
    );


  if (
    !estudantesAtuais.length
  ) {

    area.style.display =
      'none';

    return;

  }


  const faltas =
    contarFaltasSelecionadas();


  document.getElementById(
    'salvarQuantidade'
  ).innerHTML =
    '<strong>' +
    faltas +
    (
      faltas === 1
        ? ' falta'
        : ' faltas'
    ) +
    '</strong><br>' +
    '<span>selecionadas nesta turma</span>';


  area.style.display =
    'block';

}


/* =========================================================
   ADICIONAR À FILA
========================================================= */

function adicionarTurma() {

  const turma =
    document.getElementById(
      'turma'
    ).value;


  const data =
    document.getElementById(
      'data'
    ).value;


  if (!turma) {

    mostrarStatus(
      'Selecione uma turma.',
      'erro'
    );

    return;

  }


  if (!data) {

    mostrarStatus(
      'Selecione uma data.',
      'erro'
    );

    return;

  }


  if (
    !estudantesAtuais.length
  ) {

    mostrarStatus(
      'Não há estudantes para adicionar.',
      'erro'
    );

    return;

  }


  const chamada = {

    turma:
      turma,

    data:
      data,

    estudantes:
      estudantesAtuais.map(
        function (estudante) {

          return {

            id:
              estudante.id,

            nome:
              estudante.nome,

            presenca:
              estudante.statusExistente ||
              estudante.presenca

          };

        }
      )

  };


  const existente =
    filaChamadas.findIndex(
      function (item) {

        return (
          item.turma === turma &&
          item.data === data
        );

      }
    );


  if (
    existente >= 0
  ) {

    filaChamadas[
      existente
    ] =
      chamada;

  } else {

    filaChamadas.push(
      chamada
    );

  }


  mostrarStatus(
    turma +
    ' adicionada à chamada.',
    'sucesso'
  );

}


/* =========================================================
   ADICIONAR E SALVAR
========================================================= */

async function adicionarESalvar() {

  const turma =
    document.getElementById(
      'turma'
    ).value;


  const data =
    document.getElementById(
      'data'
    ).value;


  if (!turma) {

    mostrarStatus(
      'Selecione uma turma.',
      'erro'
    );

    return;

  }


  if (!data) {

    mostrarStatus(
      'Selecione uma data.',
      'erro'
    );

    return;

  }


  if (
    !estudantesAtuais.length
  ) {

    mostrarStatus(
      'Não há estudantes para salvar.',
      'erro'
    );

    return;

  }


  const chamada = {

    turma:
      turma,

    data:
      data,

    estudantes:
      estudantesAtuais.map(
        function (estudante) {

          return {

            id:
              estudante.id,

            nome:
              estudante.nome,

            presenca:
              estudante.statusExistente ||
              estudante.presenca

          };

        }
      )

  };


  filaChamadas =
    [chamada];


  await salvarTodas();

}


/* =========================================================
   SALVAR TODAS
========================================================= */

async function salvarTodas() {

  if (
    !filaChamadas.length
  ) {

    mostrarStatus(
      'Não há chamada para salvar.',
      'erro'
    );

    return;

  }


  const botoes =
    document.querySelectorAll(
      'button'
    );


  botoes.forEach(
    function (botao) {

      botao.disabled =
        true;

    }
  );


  mostrarStatus(
    'Salvando chamada...',
    'sucesso'
  );


  try {

    for (
      let i = 0;
      i < filaChamadas.length;
      i++
    ) {

      const chamada =
        filaChamadas[i];


      const payload = {

        acao:
          'salvarChamada',

        data:
          chamada.data,

        turma:
          chamada.turma,

        estudantes:
          chamada.estudantes

      };


      const resposta =
        await fetch(
          API_URL,
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      const texto =
        await resposta.text();


      let resultado;


      try {

        resultado =
          JSON.parse(
            texto
          );

      } catch (e) {

        resultado = {
          sucesso: true
        };

      }


      if (
        resultado &&
        resultado.sucesso === false
      ) {

        throw new Error(
          resultado.mensagem ||
          'Erro ao salvar a chamada.'
        );

      }

    }


    const turmaSalva =
      turmaAtual;


    filaChamadas =
      [];


    mostrarStatus(
      'Chamada de ' +
      turmaSalva +
      ' salva com sucesso.',
      'sucesso'
    );


    await carregarEstudantes(
      turmaSalva
    );


  } catch (erro) {

    mostrarStatus(
      'Erro ao salvar: ' +
      erro.message,
      'erro'
    );


    console.error(
      erro
    );


  } finally {

    botoes.forEach(
      function (botao) {

        botao.disabled =
          false;

      }
    );

  }

}

/* =========================================================
   STATUS
========================================================= */

function mostrarStatus(
  mensagem,
  tipo
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    mensagem;


  status.className =
    'status ' +
    tipo;


  clearTimeout(
    window.timerStatus
  );


  window.timerStatus =
    setTimeout(
      function () {

        status.className =
          'status';

      },
      5000
    );

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escaparHTML(valor) {

  return String(
    valor || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
