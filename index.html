<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Chamada Escolar</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .header p {
      margin: 5px 0 0;
      color: #5f6368;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow:
        0 1px 3px rgba(60, 64, 67, .15),
        0 2px 8px rgba(60, 64, 67, .08);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 7px;
    }

    select,
    input[type="date"] {
      width: 100%;
      height: 46px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 0 12px;
      background: #fff;
      color: #202124;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input[type="date"]:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, .12);
    }

    .campo {
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      height: 44px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-adicionar {
      width: 100%;
      background: #1a73e8;
      color: white;
    }

    .btn-adicionar:hover {
      background: #1769d2;
    }

    .btn-salvar {
      width: 100%;
      background: #188038;
      color: white;
      height: 48px;
      font-size: 15px;
    }

    .btn-salvar:hover {
      background: #137333;
    }

    .btn-limpar {
      width: 100%;
      margin-top: 9px;
      background: #f1f3f4;
      color: #3c4043;
    }

    .btn-limpar:hover {
      background: #e8eaed;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    .status.sucesso {
      display: block;
      background: #e6f4ea;
      color: #137333;
    }

    .status.erro {
      display: block;
      background: #fce8e6;
      color: #c5221f;
    }

    .status.info {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
    }

    .resumo {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .resumo-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 10px 5px;
      text-align: center;
    }

    .resumo-numero {
      font-size: 20px;
      font-weight: 600;
    }

    .resumo-label {
      font-size: 11px;
      color: #5f6368;
      margin-top: 2px;
    }

    .lista {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .aluno {
      border: 1px solid #dadce0;
      border-radius: 10px;
      min-height: 54px;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: white;
      cursor: pointer;
      user-select: none;
      transition: .12s;
    }

    .aluno:hover {
      background: #f8f9fa;
    }

    .aluno.falta {
      background: #fce8e6;
      border-color: #ea4335;
    }

    .aluno.atestado {
      background: #f1f3f4;
      border-color: #9aa0a6;
      cursor: default;
    }

    .aluno-info {
      flex: 1;
      min-width: 0;
    }

    .aluno-nome {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.25;
      word-break: break-word;
    }

    .aluno-status {
      margin-left: 7px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      background: #e6f4ea;
      color: #137333;
    }

    .aluno.falta .aluno-status {
      background: #ea4335;
      color: white;
    }

    .aluno.atestado .aluno-status {
      background: #80868b;
      color: white;
    }

    .lista-vazia {
      text-align: center;
      color: #5f6368;
      padding: 25px 10px;
      font-size: 14px;
      grid-column: 1 / -1;
    }

    .fila-titulo {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .fila-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border: 1px solid #dadce0;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #fff;
    }

    .fila-item-info {
      min-width: 0;
    }

    .fila-turma {
      font-weight: 600;
      font-size: 14px;
    }

    .fila-detalhe {
      font-size: 12px;
      color: #5f6368;
      margin-top: 3px;
    }

    .fila-direita {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .fila-status {
      font-size: 11px;
      font-weight: 600;
      color: #1a73e8;
      white-space: nowrap;
    }

    .btn-remover {
      height: 32px;
      padding: 0 9px;
      background: #f1f3f4;
      color: #5f6368;
      font-size: 12px;
    }

    .btn-remover:hover {
      background: #e8eaed;
    }

    .oculto {
      display: none !important;
    }

    .carregando {
      text-align: center;
      color: #5f6368;
      padding: 20px;
      font-size: 14px;
      grid-column: 1 / -1;
    }

    @media (max-width: 380px) {
      .container {
        padding: 12px;
      }

      .lista {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 14px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Chamada Escolar</h1>
      <p>Registre a frequência dos estudantes</p>
    </div>

    <div id="status" class="status"></div>

    <div class="card">

      <div class="campo">

        <label for="data">
          Data da chamada
        </label>

        <input
          type="date"
          id="data"
        >

      </div>

      <div class="campo">

        <label for="turma">
          Turma
        </label>

        <select id="turma">

          <option value="">
            Selecione a turma
          </option>

        </select>

      </div>

      <button
        type="button"
        id="btnAdicionar"
        class="btn-adicionar"
        disabled
      >
        Adicionar à chamada
      </button>

    </div>

    <div
      class="card oculto"
      id="cardAlunos"
    >

      <div
        id="listaAlunos"
        class="lista"
      ></div>

      <div
        id="resumo"
        class="resumo"
      >

        <div class="resumo-item">

          <div
            class="resumo-numero"
            id="totalAlunos"
          >
            0
          </div>

          <div class="resumo-label">
            Total
          </div>

        </div>

        <div class="resumo-item">

          <div
            class="resumo-numero"
            id="totalPresentes"
          >
            0
          </div>

          <div class="resumo-label">
            Presentes
          </div>

        </div>

        <div class="resumo-item">

          <div
            class="resumo-numero"
            id="totalFaltas"
          >
            0
          </div>

          <div class="resumo-label">
            Faltas
          </div>

        </div>

      </div>

    </div>

    <div
      class="card oculto"
      id="cardFila"
    >

      <div class="fila-titulo">
        Chamadas preparadas
      </div>

      <div id="listaFila"></div>

      <button
        type="button"
        id="btnSalvarTudo"
        class="btn-salvar"
      >
        Salvar chamadas
      </button>

      <button
        type="button"
        id="btnLimparFila"
        class="btn-limpar"
      >
        Limpar chamadas preparadas
      </button>

    </div>

  </div>

  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbzThUzCIL-flrxxXbssTVkti4zm3F7W6xZQW_J7Nw9igoflgzFQ27tjPaMtJk4Jcs9o/exec';


    const dataInput =
      document.getElementById('data');

    const turmaSelect =
      document.getElementById('turma');

    const btnAdicionar =
      document.getElementById('btnAdicionar');

    const btnSalvarTudo =
      document.getElementById('btnSalvarTudo');

    const btnLimparFila =
      document.getElementById('btnLimparFila');

    const cardAlunos =
      document.getElementById('cardAlunos');

    const listaAlunos =
      document.getElementById('listaAlunos');

    const resumo =
      document.getElementById('resumo');

    const cardFila =
      document.getElementById('cardFila');

    const listaFila =
      document.getElementById('listaFila');

    const statusDiv =
      document.getElementById('status');

    const totalAlunos =
      document.getElementById('totalAlunos');

    const totalPresentes =
      document.getElementById('totalPresentes');

    const totalFaltas =
      document.getElementById('totalFaltas');


    let estudantesAtuais = [];

    let filaChamadas = [];


    function obterDataAtual() {

      const agora = new Date();

      const ano =
        agora.getFullYear();

      const mes =
        String(
          agora.getMonth() + 1
        ).padStart(2, '0');

      const dia =
        String(
          agora.getDate()
        ).padStart(2, '0');

      return (
        ano +
        '-' +
        mes +
        '-' +
        dia
      );
    }


    dataInput.value =
      obterDataAtual();


    function mostrarStatus(
      mensagem,
      tipo
    ) {

      statusDiv.textContent =
        mensagem;

      statusDiv.className =
        'status ' + tipo;
    }


    function limparStatus() {

      statusDiv.textContent = '';

      statusDiv.className =
        'status';
    }


    async function carregarTurmas() {

      try {

        const resposta =
          await fetch(
            API_URL +
            '?acao=turmas'
          );

        const dados =
          await resposta.json();


        if (!dados.sucesso) {

          throw new Error(
            dados.erro ||
            'Erro ao carregar turmas.'
          );
        }


        turmaSelect.innerHTML =
          '<option value="">Selecione a turma</option>';


        dados.turmas.forEach(
          function(turma) {

            const option =
              document.createElement(
                'option'
              );

            option.value = turma;

            option.textContent = turma;

            turmaSelect.appendChild(
              option
            );
          }
        );


      } catch (erro) {

        mostrarStatus(
          erro.message,
          'erro'
        );
      }
    }


    async function carregarEstudantes() {

      const turma =
        turmaSelect.value;


      if (!turma) {

        cardAlunos.classList.add(
          'oculto'
        );

        btnAdicionar.disabled = true;

        return;
      }


      limparStatus();


      const chamadaExistente =
        filaChamadas.find(
          function(item) {

            return (
              item.turma === turma &&
              item.data === dataInput.value
            );
          }
        );


      if (chamadaExistente) {

        estudantesAtuais =
          JSON.parse(
            JSON.stringify(
              chamadaExistente.estudantes
            )
          );

        renderizarEstudantes();

        btnAdicionar.textContent =
          'Atualizar chamada';

        btnAdicionar.disabled = false;

        return;
      }


      cardAlunos.classList.remove(
        'oculto'
      );

      listaAlunos.innerHTML =
        '<div class="carregando">Carregando estudantes...</div>';

      resumo.style.display =
        'none';


      try {

        const resposta =
          await fetch(
            API_URL +
            '?acao=estudantes&turma=' +
            encodeURIComponent(turma)
          );


        const dados =
          await resposta.json();


        if (!dados.sucesso) {

          throw new Error(
            dados.erro ||
            'Erro ao carregar estudantes.'
          );
        }


        estudantesAtuais =
          dados.estudantes.map(
            function(estudante) {

              return {
                id: estudante.id,
                nome: estudante.nome,
                presenca: 'C',
                statusExistente: ''
              };

            }
          );


        renderizarEstudantes();


        btnAdicionar.textContent =
          'Adicionar à chamada';

        btnAdicionar.disabled = false;


      } catch (erro) {

        listaAlunos.innerHTML =
          '<div class="lista-vazia">' +
          erro.message +
          '</div>';

        btnAdicionar.disabled = true;
      }
    }


    function renderizarEstudantes() {

      cardAlunos.classList.remove(
        'oculto'
      );


      listaAlunos.innerHTML = '';


      if (
        estudantesAtuais.length === 0
      ) {

        listaAlunos.innerHTML =
          '<div class="lista-vazia">' +
          'Nenhum estudante encontrado.' +
          '</div>';

        resumo.style.display =
          'none';

        return;
      }


      estudantesAtuais.forEach(
        function(estudante) {

          const aluno =
            document.createElement(
              'div'
            );

          aluno.className =
            'aluno';


          if (
            estudante.statusExistente === 'A'
          ) {

            aluno.classList.add(
              'atestado'
            );

          } else if (
            estudante.presenca === 'F'
          ) {

            aluno.classList.add(
              'falta'
            );
          }


          const info =
            document.createElement(
              'div'
            );

          info.className =
            'aluno-info';


          const nome =
            document.createElement(
              'div'
            );

          nome.className =
            'aluno-nome';

          nome.textContent =
            estudante.nome;


          info.appendChild(nome);


          const status =
            document.createElement(
              'div'
            );

          status.className =
            'aluno-status';


          if (
            estudante.statusExistente === 'A'
          ) {

            status.textContent = 'A';

          } else if (
            estudante.presenca === 'F'
          ) {

            status.textContent = 'F';

          } else {

            status.textContent = 'C';
          }


          aluno.appendChild(info);

          aluno.appendChild(status);


          if (
            estudante.statusExistente !== 'A'
          ) {

            aluno.addEventListener(
              'click',
              function() {

                if (
                  estudante.presenca === 'C'
                ) {

                  estudante.presenca = 'F';

                } else {

                  estudante.presenca = 'C';
                }

                renderizarEstudantes();
              }
            );
          }


          listaAlunos.appendChild(aluno);

        }
      );


      atualizarResumo();
    }


    function atualizarResumo() {

      let presentes = 0;

      let faltas = 0;


      estudantesAtuais.forEach(
        function(estudante) {

          if (
            estudante.statusExistente === 'A'
          ) {
            return;
          }


          if (
            estudante.presenca === 'F'
          ) {

            faltas++;

          } else {

            presentes++;
          }
        }
      );


      totalAlunos.textContent =
        estudantesAtuais.length;

      totalPresentes.textContent =
        presentes;

      totalFaltas.textContent =
        faltas;

      resumo.style.display =
        'grid';
    }


    function adicionarChamada() {

      const turma =
        turmaSelect.value;

      const data =
        dataInput.value;


      if (!turma) {

        mostrarStatus(
          'Selecione uma turma.',
          'erro'
        );

        return;
      }


      if (!data) {

        mostrarStatus(
          'Selecione a data.',
          'erro'
        );

        return;
      }


      if (
        estudantesAtuais.length === 0
      ) {

        mostrarStatus(
          'Nenhum estudante carregado.',
          'erro'
        );

        return;
      }


      const estudantes =
        JSON.parse(
          JSON.stringify(
            estudantesAtuais
          )
        );


      const indice =
        filaChamadas.findIndex(
          function(item) {

            return (
              item.turma === turma &&
              item.data === data
            );
          }
        );


      const objeto = {
        turma: turma,
        data: data,
        estudantes: estudantes
      };


      if (indice >= 0) {

        filaChamadas[indice] =
          objeto;

      } else {

        filaChamadas.push(
          objeto
        );
      }


      atualizarFila();


      mostrarStatus(
        'Turma ' +
        turma +
        ' preparada. Selecione outra turma.',
        'sucesso'
      );


      estudantesAtuais = [];

      listaAlunos.innerHTML = '';

      cardAlunos.classList.add(
        'oculto'
      );

      resumo.style.display =
        'none';

      turmaSelect.value = '';

      btnAdicionar.disabled = true;

      btnAdicionar.textContent =
        'Adicionar à chamada';
    }


    function atualizarFila() {

      listaFila.innerHTML = '';


      if (
        filaChamadas.length === 0
      ) {

        cardFila.classList.add(
          'oculto'
        );

        return;
      }


      cardFila.classList.remove(
        'oculto'
      );


      filaChamadas.forEach(
        function(item, indice) {

          let faltas = 0;

          let atestados = 0;

          let presentes = 0;


          item.estudantes.forEach(
            function(estudante) {

              if (
                estudante.statusExistente === 'A'
              ) {

                atestados++;

              } else if (
                estudante.presenca === 'F'
              ) {

                faltas++;

              } else {

                presentes++;
              }
            }
          );


          const linha =
            document.createElement(
              'div'
            );

          linha.className =
            'fila-item';


          const info =
            document.createElement(
              'div'
            );

          info.className =
            'fila-item-info';


          const turma =
            document.createElement(
              'div'
            );

          turma.className =
            'fila-turma';

          turma.textContent =
            item.turma;


          const detalhe =
            document.createElement(
              'div'
            );

          detalhe.className =
            'fila-detalhe';

          detalhe.textContent =
            presentes +
            ' presentes · ' +
            faltas +
            ' faltas' +
            (
              atestados > 0
                ? ' · ' +
                  atestados +
                  ' atestado(s)'
                : ''
            );


          info.appendChild(turma);

          info.appendChild(detalhe);


          const direita =
            document.createElement(
              'div'
            );

          direita.className =
            'fila-direita';


          const status =
            document.createElement(
              'div'
            );

          status.className =
            'fila-status';

          status.textContent =
            'Preparada';


          const remover =
            document.createElement(
              'button'
            );

          remover.type =
            'button';

          remover.className =
            'btn-remover';

          remover.textContent =
            'Remover';


          remover.addEventListener(
            'click',
            function() {

              filaChamadas.splice(
                indice,
                1
              );

              atualizarFila();

              mostrarStatus(
                'Turma ' +
                item.turma +
                ' removida da fila.',
                'info'
              );
            }
          );


          direita.appendChild(status);

          direita.appendChild(remover);


          linha.appendChild(info);

          linha.appendChild(direita);


          listaFila.appendChild(linha);

        }
      );
    }


    async function salvarTodas() {

      if (
        filaChamadas.length === 0
      ) {

        mostrarStatus(
          'Nenhuma chamada foi preparada.',
          'erro'
        );

        return;
      }


      btnSalvarTudo.disabled = true;

      btnLimparFila.disabled = true;


      let salvas = 0;

      let erros = [];


      try {

        const filaParaSalvar =
          JSON.parse(
            JSON.stringify(
              filaChamadas
            )
          );


        for (
          const chamada of filaParaSalvar
        ) {

          try {

            const resposta =
              await fetch(
                API_URL,
                {
                  method: 'POST',

                  headers: {
                    'Content-Type':
                      'text/plain;charset=utf-8'
                  },

                  body:
                    JSON.stringify({
                      acao: 'salvar',
                      turma:
                        chamada.turma,
                      data:
                        chamada.data,
                      estudantes:
                        chamada.estudantes
                    })
                }
              );


            const resultado =
              await resposta.json();


            if (
              !resultado.sucesso
            ) {

              throw new Error(
                resultado.erro ||
                'Erro ao salvar.'
              );
            }


            salvas++;


          } catch (erro) {

            erros.push({
              turma: chamada.turma,
              mensagem: erro.message
            });
          }
        }


        /*
         * Mantém na fila somente as chamadas
         * que apresentaram erro.
         */

        if (salvas > 0) {

          const turmasComErro =
            erros.map(
              function(item) {
                return item.turma;
              }
            );


          filaChamadas =
            filaChamadas.filter(
              function(item) {

                return turmasComErro.includes(
                  item.turma
                );
              }
            );
        }


        atualizarFila();


        if (
          erros.length === 0
        ) {

          mostrarStatus(
            salvas +
            (
              salvas === 1
                ? ' turma salva com sucesso.'
                : ' turmas salvas com sucesso.'
            ),
            'sucesso'
          );


          estudantesAtuais = [];

          listaAlunos.innerHTML = '';

          cardAlunos.classList.add(
            'oculto'
          );

          resumo.style.display =
            'none';

          turmaSelect.value = '';


        } else {

          mostrarStatus(
            salvas +
            ' turma(s) salva(s). ' +
            erros.length +
            ' apresentou(aram) erro: ' +
            erros.map(
              function(item) {
                return (
                  item.turma +
                  ': ' +
                  item.mensagem
                );
              }
            ).join(' | '),
            'erro'
          );
        }


      } finally {

        btnSalvarTudo.disabled =
          false;

        btnLimparFila.disabled =
          false;
      }
    }


    function limparFila() {

      filaChamadas = [];

      atualizarFila();

      mostrarStatus(
        'Chamadas preparadas removidas.',
        'info'
      );
    }


    turmaSelect.addEventListener(
      'change',
      carregarEstudantes
    );


    btnAdicionar.addEventListener(
      'click',
      adicionarChamada
    );


    btnSalvarTudo.addEventListener(
      'click',
      salvarTodas
    );


    btnLimparFila.addEventListener(
      'click',
      limparFila
    );


    carregarTurmas();

  </script>

</body>

</html>
